<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="记账本">
    <meta name="theme-color" content="#4A90E2">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
    <link rel="manifest" href="manifest.json">
    <title>私人记账本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4A90E2;
            --primary-dark: #357ABD;
            --success-color: #27AE60;
            --warning-color: #F39C12;
            --danger-color: #E74C3C;
            --bg-color: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-primary: #2C3E50;
            --text-secondary: #7F8C8D;
            --border-color: #E1E8ED;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 12px 0;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg-color);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-color);
            color: var(--text-primary);
            transition: all 0.3s ease;
            outline: none;
        }

        .input:focus {
            border-color: var(--primary-color);
            background: var(--card-bg);
        }

        .input-large {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat-card {
            text-align: center;
            padding: 16px 8px;
            background: var(--bg-color);
            border-radius: 12px;
        }

        .stat-card.highlight {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .stat-card.highlight .stat-label {
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-unit {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .stat-card.highlight .stat-unit {
            color: rgba(255, 255, 255, 0.9);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .category-btn {
            padding: 12px 8px;
            font-size: 12px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-color);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .category-btn:active {
            transform: scale(0.95);
        }

        .category-btn.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: white;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--bg-color);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .btn-large {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            margin-top: 8px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            font-size: 20px;
            border: none;
            border-radius: 50%;
            background: var(--bg-color);
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .add-expense-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-wrapper {
            background: var(--bg-color);
            border-radius: 12px;
            padding: 16px;
        }

        .chart-wrapper h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .category-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .category-stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-color);
            border-radius: 10px;
        }

        .category-stat-item .name {
            font-size: 14px;
        }

        .category-stat-item .amount {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .history-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .empty-message {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 0;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            margin-bottom: 8px;
            background: var(--bg-color);
            border-radius: 10px;
        }

        .history-info {
            flex: 1;
        }

        .history-category {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .history-desc {
            font-size: 14px;
            font-weight: 500;
        }

        .history-date {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .history-amount {
            font-size: 18px;
            font-weight: 700;
            color: var(--danger-color);
        }

        .delete-btn {
            width: 30px;
            height: 30px;
            margin-left: 8px;
            padding: 0;
            font-size: 16px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .delete-btn:hover {
            background: var(--danger-color);
            color: white;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        .import-export-btns {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }

        #importInput {
            display: none;
        }

        @media (min-width: 768px) {
            .container {
                padding: 24px;
            }
            
            .section {
                padding: 24px;
            }
            
            .charts-container {
                grid-template-columns: 1fr 1fr;
            }
            
            .category-stats {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .stat-card.highlight {
                grid-column: 1 / -1;
            }
            
            .category-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
            }
            
            .category-btn {
                padding: 10px 6px;
                font-size: 11px;
            }
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>私人记账本</h1>
            <div class="header-actions">
                <button class="btn-icon" id="exportBtn" title="导出数据">📥</button>
                <button class="btn-icon" id="importBtn" title="导入数据">📤</button>
                <input type="file" id="importInput" accept=".json">
            </div>
        </header>

        <section class="section settings-section">
            <div class="section-title">记账周期设置</div>
            <div class="settings-grid">
                <div class="form-group">
                    <label>起始日期</label>
                    <input type="date" id="startDate" class="input">
                </div>
                <div class="form-group">
                    <label>结束日期</label>
                    <input type="date" id="endDate" class="input">
                </div>
                <div class="form-group full-width">
                    <label>周期总预算 (元)</label>
                    <input type="number" id="totalBudget" class="input" step="0.01" min="0">
                </div>
                <button class="btn btn-secondary btn-large full-width" id="saveSettingsBtn">保存设置</button>
            </div>
        </section>

        <section class="section stats-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">周期剩余</div>
                    <div class="stat-value" id="remainingBudget">0.00</div>
                    <div class="stat-unit">元</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">今日已花</div>
                    <div class="stat-value" id="todaySpent">0.00</div>
                    <div class="stat-unit">元</div>
                </div>
                <div class="stat-card highlight">
                    <div class="stat-label">日均可用</div>
                    <div class="stat-value" id="dailyAverage">0.00</div>
                    <div class="stat-unit">元/天</div>
                </div>
            </div>
        </section>

        <section class="section add-expense-section">
            <div class="section-title">新增消费</div>
            <div class="add-expense-form">
                <div class="form-group">
                    <label>消费金额 (元)</label>
                    <input type="number" id="expenseAmount" class="input input-large" step="0.01" min="0" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>消费备注</label>
                    <input type="text" id="expenseDesc" class="input" placeholder="输入消费内容...">
                </div>
                <div class="form-group">
                    <label>消费分类</label>
                    <div class="category-grid" id="categoryGrid">
                        <button class="category-btn active" data-category="餐饮">🍜 餐饮</button>
                        <button class="category-btn" data-category="交通">🚗 交通</button>
                        <button class="category-btn" data-category="购物">🛒 购物</button>
                        <button class="category-btn" data-category="娱乐">🎮 娱乐</button>
                        <button class="category-btn" data-category="医疗">💊 医疗</button>
                        <button class="category-btn" data-category="教育">📚 教育</button>
                        <button class="category-btn" data-category="住房">🏠 住房</button>
                        <button class="category-btn" data-category="其他">📦 其他</button>
                    </div>
                </div>
                <button class="btn btn-primary btn-large" id="addExpenseBtn">记一笔</button>
            </div>
        </section>

        <section class="section charts-section">
            <div class="section-title">消费分析</div>
            <div class="charts-container">
                <div class="chart-wrapper">
                    <h3>分类占比</h3>
                    <canvas id="categoryChart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <h3>每周消费</h3>
                    <canvas id="weeklyChart"></canvas>
                </div>
            </div>
            <div class="category-stats" id="categoryStats"></div>
        </section>

        <section class="section history-section">
            <div class="section-title">消费记录</div>
            <div class="history-list" id="historyList">
                <p class="empty-message">暂无消费记录</p>
            </div>
        </section>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>
        const STORAGE_KEY = 'personal_accounting_data';
        
        let settings = {
            startDate: '',
            endDate: '',
            totalBudget: 10000
        };
        let expenses = [];
        let selectedCategory = '餐饮';
        let categoryChart = null;
        let weeklyChart = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            initDefaultSettings();
            bindEvents();
            updateUI();
        });

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    settings = data.settings || settings;
                    expenses = data.expenses || [];
                }
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }

        function saveData() {
            try {
                const data = {
                    settings: settings,
                    expenses: expenses,
                    lastUpdate: new Date().toISOString()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (error) {
                console.error('保存数据失败:', error);
                showToast('保存失败');
            }
        }

        function initDefaultSettings() {
            if (!settings.startDate || !settings.endDate) {
                const today = new Date();
                const startDate = new Date(today);
                const endDate = new Date(today);
                endDate.setDate(endDate.getDate() + 30);
                
                settings.startDate = formatDate(startDate);
                settings.endDate = formatDate(endDate);
            }
        }

        function bindEvents() {
            document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
            document.getElementById('addExpenseBtn').addEventListener('click', addExpense);
            document.getElementById('exportBtn').addEventListener('click', exportData);
            document.getElementById('importBtn').addEventListener('click', () => {
                document.getElementById('importInput').click();
            });
            document.getElementById('importInput').addEventListener('change', importData);
            
            document.getElementById('expenseAmount').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addExpense();
            });
            
            document.getElementById('expenseDesc').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addExpense();
            });
            
            const categoryBtns = document.querySelectorAll('.category-btn');
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedCategory = this.dataset.category;
                });
            });
        }

        function updateUI() {
            document.getElementById('startDate').value = settings.startDate;
            document.getElementById('endDate').value = settings.endDate;
            document.getElementById('totalBudget').value = settings.totalBudget;
            
            updateStats();
            loadHistory();
            loadCharts();
        }

        function saveSettings() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const totalBudget = parseFloat(document.getElementById('totalBudget').value);
            
            if (!startDate || !endDate) {
                showToast('请选择日期');
                return;
            }
            
            if (startDate >= endDate) {
                showToast('结束日期必须晚于起始日期');
                return;
            }
            
            if (isNaN(totalBudget) || totalBudget <= 0) {
                showToast('请输入有效预算');
                return;
            }
            
            settings.startDate = startDate;
            settings.endDate = endDate;
            settings.totalBudget = totalBudget;
            
            saveData();
            showToast('设置已保存');
            updateStats();
            loadCharts();
        }

        function addExpense() {
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const description = document.getElementById('expenseDesc').value.trim();
            
            if (isNaN(amount) || amount <= 0) {
                showToast('请输入有效金额');
                return;
            }
            
            if (!description) {
                showToast('请输入消费备注');
                return;
            }
            
            const expense = {
                id: Date.now(),
                amount: amount,
                description: description,
                category: selectedCategory,
                date: formatDate(new Date()),
                createdAt: new Date().toISOString()
            };
            
            expenses.unshift(expense);
            saveData();
            
            document.getElementById('expenseAmount').value = '';
            document.getElementById('expenseDesc').value = '';
            
            showToast('记账成功');
            updateStats();
            loadHistory();
            loadCharts();
        }

        function deleteExpense(id) {
            if (!confirm('确定删除这条记录吗？')) return;
            
            expenses = expenses.filter(e => e.id !== id);
            saveData();
            
            showToast('删除成功');
            updateStats();
            loadHistory();
            loadCharts();
        }

        function updateStats() {
            const periodExpenses = expenses.filter(e => 
                e.date >= settings.startDate && e.date <= settings.endDate
            );
            
            const totalSpent = periodExpenses.reduce((sum, e) => sum + e.amount, 0);
            const remaining = settings.totalBudget - totalSpent;
            
            document.getElementById('remainingBudget').textContent = remaining.toFixed(2);
            
            const today = formatDate(new Date());
            const todayExpenses = expenses.filter(e => e.date === today);
            const todaySpent = todayExpenses.reduce((sum, e) => sum + e.amount, 0);
            document.getElementById('todaySpent').textContent = todaySpent.toFixed(2);
            
            const now = new Date();
            const end = new Date(settings.endDate);
            const daysRemaining = Math.max(0, Math.ceil((end - now) / (1000 * 60 * 60 * 24)));
            const dailyAvg = daysRemaining > 0 ? remaining / daysRemaining : 0;
            document.getElementById('dailyAverage').textContent = dailyAvg.toFixed(2);
        }

        function loadHistory() {
            const historyList = document.getElementById('historyList');
            
            if (expenses.length === 0) {
                historyList.innerHTML = '<p class="empty-message">暂无消费记录</p>';
                return;
            }
            
            historyList.innerHTML = expenses.slice(0, 50).map(expense => `
                <div class="history-item">
                    <div class="history-info">
                        <div class="history-category">${expense.category}</div>
                        <div class="history-desc">${expense.description}</div>
                        <div class="history-date">${expense.date}</div>
                    </div>
                    <div class="history-amount">-${expense.amount.toFixed(2)}</div>
                    <button class="delete-btn" onclick="deleteExpense(${expense.id})">×</button>
                </div>
            `).join('');
        }

        function loadCharts() {
            const periodExpenses = expenses.filter(e => 
                e.date >= settings.startDate && e.date <= settings.endDate
            );
            
            const categoryStats = {};
            periodExpenses.forEach(e => {
                categoryStats[e.category] = (categoryStats[e.category] || 0) + e.amount;
            });
            
            updateCategoryChart(categoryStats);
            updateWeeklyChart(periodExpenses);
            updateCategoryStatsList(categoryStats);
        }

        function updateCategoryChart(categoryStats) {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            
            if (categoryChart) {
                categoryChart.destroy();
            }
            
            const labels = Object.keys(categoryStats);
            const data = Object.values(categoryStats);
            
            if (labels.length === 0) {
                ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                ctx.font = '14px -apple-system';
                ctx.fillStyle = '#7F8C8D';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', ctx.canvas.width / 2, ctx.canvas.height / 2);
                return;
            }
            
            const colors = [
                '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                '#9966FF', '#FF9F40', '#FF6384', '#C9CBCF'
            ];
            
            categoryChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors.slice(0, labels.length),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 12,
                                usePointStyle: true,
                                font: { size: 12 }
                            }
                        }
                    }
                }
            });
        }

        function updateWeeklyChart(periodExpenses) {
            const ctx = document.getElementById('weeklyChart').getContext('2d');
            
            if (weeklyChart) {
                weeklyChart.destroy();
            }
            
            if (periodExpenses.length === 0) {
                ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                ctx.font = '14px -apple-system';
                ctx.fillStyle = '#7F8C8D';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', ctx.canvas.width / 2, ctx.canvas.height / 2);
                return;
            }
            
            const weekGroups = {};
            periodExpenses.forEach(e => {
                const date = new Date(e.date);
                const year = date.getFullYear();
                const week = getWeekNumber(date);
                const weekKey = `${year}-${week.toString().padStart(2, '0')}`;
                
                if (!weekGroups[weekKey]) {
                    weekGroups[weekKey] = {};
                }
                weekGroups[weekKey][e.category] = (weekGroups[weekKey][e.category] || 0) + e.amount;
            });
            
            const weeks = Object.keys(weekGroups).sort();
            const categories = [...new Set(periodExpenses.map(e => e.category))];
            
            const colors = [
                '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                '#9966FF', '#FF9F40', '#FF6384', '#C9CBCF'
            ];
            
            const datasets = categories.map((cat, index) => ({
                label: cat,
                data: weeks.map(w => weekGroups[w][cat] || 0),
                backgroundColor: colors[index % colors.length]
            }));
            
            weeklyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: weeks.map(w => `第${w.split('-')[1]}周`),
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true }
                    }
                }
            });
        }

        function updateCategoryStatsList(categoryStats) {
            const container = document.getElementById('categoryStats');
            
            const entries = Object.entries(categoryStats).sort((a, b) => b[1] - a[1]);
            
            if (entries.length === 0) {
                container.innerHTML = '';
                return;
            }
            
            container.innerHTML = entries.map(([name, amount]) => `
                <div class="category-stat-item">
                    <span class="name">${name}</span>
                    <span class="amount">¥${amount.toFixed(2)}</span>
                </div>
            `).join('');
        }

        function exportData() {
            const data = {
                settings: settings,
                expenses: expenses,
                exportDate: new Date().toISOString(),
                version: '1.0'
            };
            
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `记账数据_${formatDate(new Date())}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('导出成功');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (!data.settings || !data.expenses) {
                        showToast('文件格式错误');
                        return;
                    }
                    
                    if (confirm(`确认导入数据？\n\n导入后当前数据将被覆盖！\n待导入记录数：${data.expenses.length}条`)) {
                        settings = data.settings;
                        expenses = data.expenses;
                        saveData();
                        updateUI();
                        showToast('导入成功');
                    }
                } catch (error) {
                    console.error('导入失败:', error);
                    showToast('导入失败，文件格式错误');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getWeekNumber(date) {
            const firstDay = new Date(date.getFullYear(), 0, 1);
            const days = Math.floor((date - firstDay) / (24 * 60 * 60 * 1000));
            return Math.ceil((days + firstDay.getDay() + 1) / 7);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        window.deleteExpense = deleteExpense;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
